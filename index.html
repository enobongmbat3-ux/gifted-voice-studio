<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gifted Voice Studio — Transform the Voice. Preserve the Story.</title>
<meta name="description" content="AI voice conversion that keeps the dialogue, emotion, pacing and timing of your original recording.">
<meta name="theme-color" content="#10182B">
<style>
:root{--bg:#10182B;--card:#192640;--card2:#1f2f4f;--blue:#478BFF;--text:#fff;--muted:#a9b6d3;--line:#2a3a5e;--err:#ff6b7a;--ok:#4fd1a1}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1000px 500px at 50% -150px,#1d3566 0,transparent 70%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#2a5fd1);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 26px;font:600 16px inherit;font-family:inherit;color:#fff;background:var(--blue);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;transition:.15s;box-shadow:0 8px 24px rgba(71,139,255,.3)}
.btn:hover:not(:disabled){background:#5d99ff;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text);padding:8px 14px;min-height:40px;font-size:14px}
.btn.ghost:hover:not(:disabled){background:var(--card2);transform:none}
:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
.hero{text-align:center;padding:56px 0 40px}
.pill{display:inline-block;border:1px solid var(--line);background:rgba(25,38,64,.7);color:var(--muted);padding:6px 14px;border-radius:99px;font-size:13px;margin-bottom:22px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.08;margin:0 0 18px;letter-spacing:-1.2px}
h1 span{color:var(--blue)}
.hero p{max-width:620px;margin:0 auto 30px;color:var(--muted);font-size:clamp(16px,2.4vw,19px)}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:48px;margin-top:38px}
.wave b{width:5px;border-radius:3px;background:linear-gradient(var(--blue),#8fb7ff);animation:w 1.4s ease-in-out infinite}
@keyframes w{50%{transform:scaleY(.35)}}
@media(prefers-reduced-motion:reduce){.wave b{animation:none}html{scroll-behavior:auto}}
section{padding:44px 0}
h2{font-size:clamp(26px,4vw,36px);margin:0 0 8px;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;gap:18px}
.steps{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
<div class="hero">
  <span class="pill">Voice conversion for filmmakers &amp; creators</span>
  <h1>Transform the Voice.<br><span>Preserve the Story.</span></h1>
  <p>Upload a recording and a reference voice you have permission to use. Keep the original dialogue, emotion, pacing and timing — change only who is speaking.</p>
  <a class="btn big" href="#studio" id="start">Start Converting →</a>
  <div class="wave" aria-hidden="true"></div>
</div>

<section id="how">
  <h2>How it works</h2><p class="sub">Four simple steps. No account needed.</p>
  <div class="grid steps">
    <div class="card step"><b>1</b><h3>Add Source Audio</h3><p>The recording whose words and performance you want to keep.</p></div>
    <div class="card step"><b>2</b><h3>Add Reference Voice</h3><p>A clean sample of the voice you want to hear. Cleaner audio means better results.</p></div>
    <div class="card step"><b>3</b><h3>Convert</h3><p>Confirm you have permission, then start the conversion.</p></div>
    <div class="card step"><b>4</b><h3>Preview &amp; download</h3><p>Listen to the result and download your finished audio.</p></div>
  </div>
</section>

<section id="studio">
  <h2>Studio</h2><p class="sub">MP3, WAV, M4A, OGG, FLAC or WebM · up to <span id="maxmb">25</span> MB each. Files stay in your browser until you press Convert.</p>
  <div id="svc" class="alert warn hidden" role="status"></div>
  <div class="grid uploads" id="uploads" style="margin-top:18px"></div>

  <label class="consent"><input type="checkbox" id="consent">
    <span>I confirm I own, or have clear permission to use, the voice in the Reference Voice recording.</span></label>

  <div class="actions">
    <button class="btn big" id="convert" disabled>Convert Voice</button>
    <div id="error" class="alert err hidden" role="alert"></div>
  </div>

  <div id="result" class="card result hidden" style="margin-top:28px">
    <h3>Your converted audio</h3>
    <p class="sub" style="margin-bottom:14px">Listen first, then download.</p>
    <audio id="outAudio" controls></audio>
    <a class="btn" id="download" download="converted-voice.wav">Download audio</a>
  </div>
</section>

<section>
  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <div><h3 style="margin:0">Use voices with permission</h3>
    <p>Only convert to voices you own or have explicit consent to use. Don't use this tool to impersonate, deceive or harm anyone, and disclose AI-generated voices where appropriate.</p></div>
  </div>
</section>

<section id="faq">
  <h2>FAQ</h2><p class="sub">Quick answers.</p>
  <details><summary>What kind of audio works best?</summary><p>Clear speech with little background noise. For the reference, 10–60 seconds of a single speaker works well. Music or overlapping voices reduce quality.</p></details>
  <details><summary>Will the timing and emotion stay the same?</summary><p>The goal is to keep the original dialogue, pacing and emotion as closely as the underlying model allows. Results vary with audio quality.</p></details>
  <details><summary>Are my files uploaded when I select them?</summary><p>No. Previews play locally in your browser. Files are sent to the voice model only when you press Convert. For now that is a public Hugging Face demo run by a third party, so don't upload private or sensitive audio.</p></details>
  <details><summary>Why did my conversion fail?</summary><p>The free public model can be busy, asleep or out of GPU quota. Wait a minute and try again, or use shorter clips. This app never fakes results.</p></details>
  <details><summary>Can I use any voice?</summary><p>Only voices you own or have permission to use.</p></details>
</section>
<footer>© <span id="yr"></span> Gifted Voice Studio · Use voices responsibly. · <span id="build"></span></footer>
</div>

<script type="module">
// ===== Configuration =====
// Real voice conversion via a Seed-VC Gradio Space (official Gradio JS client, no secret keys in the browser).
// To use your own copy of the Space, change SPACE_URL. Pin the client version once tested (see README).
const SPACE_URL = "https://mtnproductions-seed-vc.hf.space";
const BUILD = "v4-seedvc-html"; // shown in the footer so you can confirm which version is live
const ENDPOINT = "/predict_1"; // Seed-VC V1: changes the voice only; keeps words, timing and delivery
const GRADIO_CLIENT_URL = "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const PARAMS = {diffusion_steps:25, length_adjust:1.0, inference_cfg_rate:0.7, f0_condition:false, auto_f0_adjust:true, pitch_shift:0};
const MAX_MB = 25;
// =========================
const $ = s => document.querySelector(s);
const files = {source:null, reference:null};
const slots = [
  {key:"source", title:"Source Audio", hint:"The recording to convert"},
  {key:"reference", title:"Reference Voice", hint:"The voice you want to hear"}
];
const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>';
$("#maxmb").textContent = MAX_MB; $("#yr").textContent = new Date().getFullYear(); $("#build").textContent = BUILD;
$(".wave").innerHTML = Array.from({length:28},(_,i)=>`<b style="height:${14+Math.abs(Math.sin(i*.7))*32}px;animation-delay:${i*.06}s"></b>`).join("");

const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
const fmtDur = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "—";
const esc = t => t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Build upload cards
$("#uploads").innerHTML = slots.map(s=>`
<div class="card" id="card-${s.key}">
  <h3>${s.title}</h3><p class="sub" style="margin-bottom:14px;font-size:14px">${s.hint}</p>
  <label class="drop" id="drop-${s.key}" tabindex="0" role="button" aria-label="Upload ${s.title}">
    ${icon}<span><strong>Drag &amp; drop</strong> or tap to browse</span><span style="font-size:13px">Audio files only</span>
    <input type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm" id="in-${s.key}" class="hidden">
  </label>
  <div class="file hidden" id="file-${s.key}"></div>
  <p class="err-inline" id="err-${s.key}" role="alert"></p>
</div>`).join("");

slots.forEach(({key})=>{
  const drop=$("#drop-"+key), input=$("#in-"+key);
  input.addEventListener("change",()=>{ if(input.files[0]) setFile(key,input.files[0]); input.value=""; });
  drop.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click();} });
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) setFile(key,f); });
});

function setFile(key,f){
  const err=$("#err-"+key); err.textContent="";
  const okType = f.type.startsWith("audio/") || /\.(mp3|wav|m4a|ogg|flac|webm|aac)$/i.test(f.name);
  if(!okType) return err.textContent="That doesn't look like an audio file. Try MP3, WAV, M4A, OGG or FLAC.";
  if(f.size>MAX_MB*1048576) return err.textContent=`File is too large (${fmtSize(f.size)}). Max is ${MAX_MB} MB.`;
  if(f.size===0) return err.textContent="That file is empty.";
  if(files[key]) URL.revokeObjectURL(files[key].url);
  const url=URL.createObjectURL(f);
  files[key]={file:f,url,dur:NaN};
  const probe=new Audio(); probe.preload="metadata"; probe.src=url;
  probe.onloadedmetadata=()=>{ files[key].dur=probe.duration; renderFile(key); };
  probe.onerror=()=>{ URL.revokeObjectURL(url); files[key]=null; err.textContent="Your browser couldn't read this audio. Try converting it to MP3 or WAV."; renderFile(key); refresh(); };
  renderFile(key); hideResult(); refresh();
}
function renderFile(key){
  const d=files[key], box=$("#file-"+key), drop=$("#drop-"+key);
  box.classList.toggle("hidden",!d); drop.classList.toggle("hidden",!!d);
  if(!d) return box.innerHTML="";
  box.innerHTML=`<div class="fname">${esc(d.file.name)}</div>
  <div class="meta"><span>${fmtSize(d.file.size)}</span><span>${fmtDur(d.dur)}</span><span>${esc(d.file.type||"audio")}</span></div>
  <audio controls preload="metadata" src="${d.url}"></audio>
  <div class="row"><button class="btn ghost" data-a="replace">Replace</button><button class="btn ghost" data-a="remove">Remove</button></div>`;
  box.querySelector('[data-a=replace]').onclick=()=>$("#in-"+key).click();
  box.querySelector('[data-a=remove]').onclick=()=>{ URL.revokeObjectURL(d.url); files[key]=null; renderFile(key); hideResult(); refresh(); };
}

const btn=$("#convert"), consent=$("#consent");
let busy=false;
function refresh(){ btn.disabled = busy || !(files.source&&files.reference&&consent.checked); }
consent.addEventListener("change",refresh);
function showError(m,trace){
  const e=$("#error"); e.textContent=m; e.classList.toggle("hidden",!m);
  if(!(m&&trace&&trace.length)) return;
  const d=document.createElement("details"); d.style.cssText="margin:12px 0 0;padding:0;background:none;border:0";
  const sm=document.createElement("summary"); sm.textContent="Technical details"; d.appendChild(sm);
  const txt=JSON.stringify(trace,null,1);
  const pre=document.createElement("pre"); pre.textContent=txt;
  pre.style.cssText="font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;margin:8px 0;color:#ffd9dd;user-select:text";
  const b=document.createElement("button"); b.type="button"; b.className="btn ghost"; b.textContent="Copy details";
  b.onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); b.textContent="Copied"; }catch{ b.textContent="Press and hold the text to copy"; } };
  d.append(pre,b); e.appendChild(d);
}
// Helpers: reduce Gradio messages to a short, readable trace (no audio content)
const clip=(v,d=0)=>{ if(typeof v==="string") return v.length>160?v.slice(0,160)+"…":v;
  if(Array.isArray(v)) return d>3?"[…]":v.map(x=>clip(x,d+1));
  if(v&&typeof v==="object") return d>3?"{…}":Object.fromEntries(Object.entries(v).slice(0,20).map(([k,x])=>[k,clip(x,d+1)]));
  return v; };
const summarize=m=>({type:m.type,stage:m.stage,position:m.position,message:m.message,data:m.type==="data"?clip(m.data):undefined});
// Turn one Gradio output value into a playable URL, or null. Accepts a FileData object (url or path), or a string.
function toFileRef(x){
  if(!x) return null;
  if(typeof x==="string") return /^https?:/.test(x)?x:`${SPACE_URL}/gradio_api/file=${x}`;
  if(typeof x==="object"){ const u=x.url||x.path; if(typeof u!=="string"||!u) return null;
    return /^https?:/.test(u)?u:`${SPACE_URL}/gradio_api/file=${u}`; }
  return null;
}
function hideResult(){ $("#result").classList.add("hidden"); const a=$("#outAudio"); if(a.src){URL.revokeObjectURL(a.src); a.removeAttribute("src");} }

const svc=$("#svc"); svc.classList.remove("hidden");
svc.textContent="Public demo model: your audio is processed by a third-party Seed-VC Space on Hugging Face when you press Convert. It may be queued, slow or unavailable, so don't upload private audio.";
let statusMsg="", t0=0, tick=null;
const mmss=()=>{ const x=Math.floor((Date.now()-t0)/1000); return Math.floor(x/60)+":"+String(x%60).padStart(2,"0"); };
const paint=()=>{ btn.innerHTML=`<span class="spin"></span> ${statusMsg} · ${mmss()}`; };
const STATUS = m => { statusMsg=m; paint(); };

btn.addEventListener("click",async()=>{
  showError(""); hideResult(); busy=true; refresh(); t0=Date.now(); tick=setInterval(paint,1000); STATUS("Connecting to the voice model (a public Space can be queued or asleep)…");
  let job=null, timedOut=false, step="starting"; const trace=[{step:"build",value:BUILD,space:SPACE_URL,endpoint:ENDPOINT}];
  const t=setTimeout(()=>{ timedOut=true; try{ job&&job.cancel&&job.cancel(); }catch{} },10*60*1000);
  try{
    let mod;
    step="loading connector"; try{ mod=await import(GRADIO_CLIENT_URL); }catch{ throw new Error("Couldn't load the voice-model connector. Check your internet connection."); }
    const {Client,handle_file}=mod;
    step="connecting to Space";
    const onSpace=st=>{ try{ trace.push({step:"space status",status:st&&st.status,message:st&&st.message}); const k=st&&st.status;
      if(k==="sleeping"||k==="building"||k==="starting"||k==="paused") STATUS("The Space is waking up, this can take a few minutes…"); }catch{} };
    const client=await Promise.race([
      Client.connect(SPACE_URL,{status_callback:onSpace}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Couldn't connect to the Space within 3 minutes. It may be asleep, busy or offline. Try again shortly.")),180000))
    ]);
    step="running conversion ("+ENDPOINT+")";
    const wrap=f=>typeof handle_file==="function"?handle_file(f):f;
    job=client.submit(ENDPOINT,{
      source_audio_path:wrap(files.source.file),
      target_audio_path:wrap(files.reference.file),
      ...PARAMS
    });
    let fullAudio=null; // keeps the latest non-empty SECOND output ("Full Output Audio") seen in any message
    for await(const msg of job){
      trace.push(summarize(msg)); if(trace.length>40) trace.shift();
      if(msg.type==="status"){
        if(msg.stage==="error") throw new Error(msg.message||"The model reported an error.");
        if(typeof msg.position==="number" && msg.position>0) STATUS(`Waiting in the queue (position ${msg.position+1})…`);
        else if(msg.stage==="pending") STATUS("Starting the model… a sleeping model can take a few minutes");
        else STATUS("Converting your voice…");
      }else if(msg.type==="data" && Array.isArray(msg.data)){
        const ref=toFileRef(msg.data[1]); // index 1 only; index 0 is stream chunks
        if(ref) fullAudio=ref;
      }
    }
    if(timedOut) throw new Error("The conversion took too long and was cancelled. Try shorter clips.");
    if(!fullAudio) throw new Error("The model finished, but its second output (Full Output Audio) was empty or in a format this app doesn't recognise. Open “Technical details” below, copy them and send them so the exact format can be fixed.");
    const remote=fullAudio;
    const audio=$("#outAudio"), dl=$("#download");
    step="fetching converted audio";
    let r=null; try{ r=await fetch(remote); }catch{ r=null; } // null = network/CORS block, not an HTTP error
    trace.push({step:"fetch audio",host:new URL(remote).host,path:new URL(remote).pathname.replace(/[^/]*$/,"…"),status:r?r.status:"blocked/no response"});
    if(r&&!r.ok) throw new Error(`The converted audio could not be retrieved from the model server (HTTP ${r.status}).`);
    let blob=null; if(r){ try{ blob=await r.blob(); }catch{} }
    if(blob&&blob.size){
      const url=URL.createObjectURL(blob);
      audio.src=url; dl.href=url; dl.removeAttribute("target");
      const ty=blob.type||"";
      dl.download="converted-voice."+(ty.includes("mpeg")?"mp3":ty.includes("ogg")?"ogg":"wav");
    }else{ // browser blocked reading the file: still play and link the real file
      audio.src=remote; dl.href=remote; dl.target="_blank"; dl.rel="noopener"; dl.removeAttribute("download");
    }
    $("#result").classList.remove("hidden");
    $("#result").scrollIntoView({behavior:"smooth",block:"center"});
  }catch(e){
    const m=(e&&e.message)||(typeof e==="string"?e:"");
    trace.push({step:"failed at",value:step,error:m}); console.warn("Gifted Voice Studio",BUILD,"failed at:",step,m);
    showError((m||"The voice model is unavailable or the conversion failed. Please try again in a minute, or use shorter clips.")+` (step: ${step})`,trace);
  }finally{
    clearTimeout(t); clearInterval(tick); busy=false; btn.textContent="Convert Voice"; refresh();
  }
});
</script>
</body>
        </html>
